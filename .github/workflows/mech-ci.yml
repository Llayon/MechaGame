name: MechaGame checks
on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Compile and sample smoothstep fades in Chrome WebGL
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome is required for WebGL smoke testing" >&2
            exit 1
          fi
          timeout 30s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-angle=swiftshader-webgl \
            --disable-background-networking --no-first-run --virtual-time-budget=1500 \
            --dump-dom "file://$PWD/public/shader-smoothstep-webgl-check.html" \
            > /tmp/mecha-webgl.html 2>/tmp/mecha-chrome-stderr.log || {
              cat /tmp/mecha-chrome-stderr.log
              exit 1
            }
          grep -F '<pre id="result">WebGL-FADES-PASS - 7 GLSL fades, 21 pixel assertions</pre>' /tmp/mecha-webgl.html || {
            cat /tmp/mecha-webgl.html
            cat /tmp/mecha-chrome-stderr.log
            exit 1
          }

      - name: Browser-decode OGG and MP3 with Chrome DevTools Protocol
        run: |
          bun run preview --host 127.0.0.1 --port 4173 > /tmp/mecha-audio-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/audio-decode-smoke.html > /dev/null; then break; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          timeout 55s bun scripts/check-audio-decode.mjs

      - name: Gameplay camera and aiming browser smoke
        run: |
          if ! curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
            bun run preview --host 127.0.0.1 --port 4173 >/tmp/mecha-aim-preview.log 2>&1 &
            sleep 3
          fi
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          timeout 100s bun scripts/control-smoke.mjs
